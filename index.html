<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cassette Stopwatch</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="cassette-container">
    <div class="screw top-left"></div>
    <div class="screw top-right"></div>
    <div class="screw bottom-left"></div>
    <div class="screw bottom-right"></div>

    <div class="label-area">
      <div class="label-title">VINTAGE TAPE DECK</div>
      
      <!-- Reels & Display -->
      <div class="window-section">
        <div class="reel left-reel" id="leftReel">
          <div class="sprocket-center"></div>
        </div>
        
        <div class="digital-display" id="display">00:00:00.00</div>
        
        <div class="reel right-reel" id="rightReel">
          <div class="sprocket-center"></div>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="startBtn" class="btn btn-start">START</button>
      <button id="pauseBtn" class="btn btn-pause" disabled>PAUSE</button>
      <button id="lapBtn" class="btn btn-lap" disabled>LAP</button>
      <button id="resetBtn" class="btn btn-reset">RESET</button>
    </div>

    <!-- Lap History -->
    <div class="laps-container">
      <h3>LAP TIMES</h3>
      <ul id="lapsList"></ul>
    </div>
  </div>

  <script src="script.js">
  </script>
</body>
</html>
